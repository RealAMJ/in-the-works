name: Live scores and site

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (GitHub may start runs a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update live games
        id: live
        run: |
          python3 scripts/update.py
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "swedes-abroad-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -q -m "Live update $(TZ=Europe/Stockholm date '+%Y-%m-%d %H:%M')"
            git pull -q --rebase && git push -q
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.live.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v3
        if: steps.live.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: .

      - uses: actions/deploy-pages@v4
        if: steps.live.outputs.changed == 'true' || github.event_name != 'schedule'
